<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Calculadora IMC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Calculadora de IMC</h1>
    
    <div>
      <label>Peso (kg):</label>
      <input type="number" id="peso" step="0.1">
    </div>
    
    <div>
      <label>Altura (m):</label>
      <input type="number" id="altura" step="0.01">
    </div>
    
    <button id="calcular">Calcular IMC</button>
    
    <div id="resultado" style="display:none;">
      <h3>Tu IMC: <span id="imcValor"></span></h3>
      <h3>Clasificación: <span id="clasificacion"></span></h3>
    </div>
    
    <h2>Historial</h2>
    <button id="limpiar">Limpiar historial</button>
    
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Peso</th>
          <th>Altura</th>
          <th>IMC</th>
          <th>Clasificación</th>
        </tr>
      </thead>
      <tbody id="tablaHistorial"></tbody>
    </table>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
